<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blokedex</title>
    <style>
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #0b0d12;
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 8vw, 4rem) clamp(1.25rem, 6vw, 3rem);
        border: 1px solid #252b38;
        border-radius: 1.5rem;
        background: #121722;
        box-shadow: 0 1.5rem 4rem #0006;
      }

      .brand {
        margin: 0 0 0.75rem;
        color: #8fa8ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 8vw, 3.75rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #b8c0d0;
        font-size: clamp(1rem, 3vw, 1.15rem);
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.75rem;
        margin-top: 2rem;
      }

      .unit {
        padding: 1rem 0.5rem;
        border-radius: 0.75rem;
        background: #1b2332;
      }

      .unit strong {
        display: block;
        color: #fff;
        font-size: clamp(1.75rem, 7vw, 3rem);
        line-height: 1;
      }

      .unit span {
        display: block;
        margin-top: 0.5rem;
        color: #8e9ab0;
        font-size: 0.8rem;
        text-transform: uppercase;
      }

      #finished {
        margin-top: 2rem;
        color: #8fa8ff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Blokedex</p>
      <h1>La web está casi lista</h1>
      <p id="intro">Abriremos nuestras puertas el 11 de septiembre.</p>

      <section class="countdown" id="countdown" aria-label="Cuenta atrás">
        <div class="unit"><strong id="days">00</strong><span>Días</span></div>
        <div class="unit"><strong id="hours">00</strong><span>Horas</span></div>
        <div class="unit"><strong id="minutes">00</strong><span>Minutos</span></div>
        <div class="unit"><strong id="seconds">00</strong><span>Segundos</span></div>
      </section>

      <p id="finished" hidden>En breves estará disponible la web.</p>
    </main>

    <script>
      const target = new Date(2026, 8, 11, 0, 0, 0);
      const countdown = document.querySelector("#countdown");
      const intro = document.querySelector("#intro");
      const finished = document.querySelector("#finished");
      const units = {
        days: document.querySelector("#days"),
        hours: document.querySelector("#hours"),
        minutes: document.querySelector("#minutes"),
        seconds: document.querySelector("#seconds")
      };

      function updateCountdown() {
        const remaining = target - Date.now();

        if (remaining <= 0) {
          countdown.hidden = true;
          intro.hidden = true;
          finished.hidden = false;
          return;
        }

        const totalSeconds = Math.floor(remaining / 1000);
        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        units.days.textContent = String(days).padStart(2, "0");
        units.hours.textContent = String(hours).padStart(2, "0");
        units.minutes.textContent = String(minutes).padStart(2, "0");
        units.seconds.textContent = String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
